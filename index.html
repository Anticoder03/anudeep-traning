<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Video</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            overflow-x: hidden;
        }

        video {
            display: block;
            width: 100%;
            height: auto;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <video 
        src="./landscape_enhanced_video~2.mp4"
        autoplay
        muted
        loop
        playsinline>
    </video>

</body>
</html>
